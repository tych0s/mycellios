name: Native node build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native_scope:
    name: Native build scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: scope
        name: Detect native changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            src/node \
            src/worker \
            src/contracts \
            python \
            sidecars \
            scripts \
            'package*.json' \
            .github/workflows/node-build.yml; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

  node:
    name: mycellios-node · ${{ matrix.target }}
    needs: native_scope
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-14
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Native build not required
        if: needs.native_scope.outputs.required != 'true'
        run: echo "No native inputs changed; reporting the required check without rebuilding installers."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.native_scope.outputs.required == 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.native_scope.outputs.required == 'true'
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: needs.native_scope.outputs.required == 'true'
        with:
          python-version: "3.12"
      - if: needs.native_scope.outputs.required == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: needs.native_scope.outputs.required == 'true'
        run: npm run typecheck
      - if: needs.native_scope.outputs.required == 'true'
        run: npm run node:runtime:check
      - name: Install pinned WiX toolset
        if: needs.native_scope.outputs.required == 'true' && matrix.target == 'windows-x64'
        shell: powershell
        # Hosted images can carry a newer 3.14.1 package revision. Force the
        # audited version instead of failing before the MSI build starts.
        run: choco install wixtoolset --version=3.14.1 --allow-downgrade --no-progress -y
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.native_scope.outputs.required == 'true' && matrix.target == 'windows-x64'
        with:
          dotnet-version: 8.0.423
      - name: Build Windows Job Object broker
        if: needs.native_scope.outputs.required == 'true' && matrix.target == 'windows-x64'
        run: npm run node:isolation-broker
      - name: Fetch pinned Windows service wrapper
        if: needs.native_scope.outputs.required == 'true' && matrix.target == 'windows-x64'
        run: node scripts/fetch-windows-service-wrapper.mjs --output=build/windows-service-wrapper/MycelliosNode.exe
      - if: needs.native_scope.outputs.required == 'true'
        run: npx vitest run tests/node- tests/headless-worker.test.ts tests/worker-hardening.test.ts tests/worker-registration-error.test.ts tests/auto-distribute.test.ts tests/windows-job-broker
      - name: Compile production node payload
        if: needs.native_scope.outputs.required == 'true'
        run: npm run clean --silent && npx tsc -p tsconfig.build.json
      - name: Build certified portable Python runtime
        if: needs.native_scope.outputs.required == 'true'
        run: npm run node:runtime
      - name: Stage native node payload
        if: needs.native_scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          stage_node() {
            node scripts/stage-node-installer.mjs \
              --dist=dist \
              --runtime=build/distribution-runtime \
              --node-executable="$(node -p 'process.execPath')" \
              --node-modules=node_modules \
              --source-root=. \
              --target="${{ matrix.target }}" \
              --source-revision="$GITHUB_SHA" \
              "$@" \
              --output="build/node-package/${{ matrix.target }}"
          }
          if [[ "${{ matrix.target }}" == "windows-x64" ]]; then
            stage_node \
              --broker-executable=build/windows-job-broker/mycellios-job-broker.exe \
              --service-wrapper-executable=build/windows-service-wrapper/MycelliosNode.exe
          else
            stage_node
          fi
          node scripts/verify-node-installer.mjs --root="build/node-package/${{ matrix.target }}"
      - name: Build and verify native Debian installer
        if: needs.native_scope.outputs.required == 'true' && matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          node scripts/build-node-deb.mjs \
            --staged-root="build/node-package/${{ matrix.target }}" \
            --output="build/mycellios-node-${version}-linux-x64.deb" \
            --version="$version" \
            --source-revision="$GITHUB_SHA" \
            --source-date-epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          node scripts/verify-node-deb.mjs \
            --deb="build/mycellios-node-${version}-linux-x64.deb" \
            --staged-root="build/node-package/${{ matrix.target }}" \
            --version="$version"
          artifact="build/mycellios-node-${version}-linux-x64.deb"
          evidence="build/evidence/${{ matrix.target }}"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          node scripts/node-release-evidence.mjs --artifact="$artifact" --staged-root="build/node-package/${{ matrix.target }}" --output-directory="$evidence" --source-date-epoch="$epoch" --builder-os="${{ runner.os }}" --builder-arch="${{ runner.arch }}" --workflow="$GITHUB_WORKFLOW" --run-id="$GITHUB_RUN_ID" --run-attempt="$GITHUB_RUN_ATTEMPT"
          node scripts/verify-node-release-evidence.mjs --artifact="$artifact" --staged-root="build/node-package/${{ matrix.target }}" --evidence="$evidence/$(basename "$artifact").provenance.json" --sbom="$evidence/$(basename "$artifact").cdx.json" --checksum="$evidence/$(basename "$artifact").sha256"
      - name: Build and verify native macOS installer
        if: needs.native_scope.outputs.required == 'true' && matrix.target == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          pkg="build/mycellios-node-${version}-macos-arm64.pkg"
          node scripts/build-node-pkg.mjs \
            --staged-root="build/node-package/${{ matrix.target }}" \
            --output="$pkg" \
            --version="$version" \
            --source-date-epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          node scripts/verify-node-pkg.mjs \
            --pkg="$pkg" \
            --staged-root="build/node-package/${{ matrix.target }}" \
            --version="$version"
          evidence="build/evidence/${{ matrix.target }}"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          node scripts/node-release-evidence.mjs --artifact="$pkg" --staged-root="build/node-package/${{ matrix.target }}" --output-directory="$evidence" --source-date-epoch="$epoch" --builder-os="${{ runner.os }}" --builder-arch="${{ runner.arch }}" --workflow="$GITHUB_WORKFLOW" --run-id="$GITHUB_RUN_ID" --run-attempt="$GITHUB_RUN_ATTEMPT"
          node scripts/verify-node-release-evidence.mjs --artifact="$pkg" --staged-root="build/node-package/${{ matrix.target }}" --evidence="$evidence/$(basename "$pkg").provenance.json" --sbom="$evidence/$(basename "$pkg").cdx.json" --checksum="$evidence/$(basename "$pkg").sha256"
      - name: Build and verify native Windows installer
        if: needs.native_scope.outputs.required == 'true' && matrix.target == 'windows-x64'
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          $msi = "build/mycellios-node-$version-windows-x64.msi"
          node scripts/build-node-msi.mjs `
            --staged-root="build/node-package/${{ matrix.target }}" `
            --output="$msi" `
            --version="$version" `
            --source-revision="$env:GITHUB_SHA"
          node scripts/verify-node-msi.mjs `
            --msi="$msi" `
            --staged-root="build/node-package/${{ matrix.target }}" `
            --version="$version" `
            --source-revision="$env:GITHUB_SHA"
          $evidence = "build/evidence/${{ matrix.target }}"
          $epoch = git show -s --format=%ct "$env:GITHUB_SHA"
          node scripts/node-release-evidence.mjs --artifact="$msi" --staged-root="build/node-package/${{ matrix.target }}" --output-directory="$evidence" --source-date-epoch="$epoch" --builder-os="${{ runner.os }}" --builder-arch="${{ runner.arch }}" --workflow="$env:GITHUB_WORKFLOW" --run-id="$env:GITHUB_RUN_ID" --run-attempt="$env:GITHUB_RUN_ATTEMPT"
          $name = Split-Path $msi -Leaf
          node scripts/verify-node-release-evidence.mjs --artifact="$msi" --staged-root="build/node-package/${{ matrix.target }}" --evidence="$evidence/$name.provenance.json" --sbom="$evidence/$name.cdx.json" --checksum="$evidence/$name.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.native_scope.outputs.required == 'true'
        with:
          name: mycellios-node-${{ matrix.target }}
          path: |
            build/node-package/${{ matrix.target }}
            build/*.deb
            build/*.pkg
            build/*.msi
            build/evidence/${{ matrix.target }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  assemble_release_candidate:
    name: Native release candidate assembly
    needs: [native_scope, node]
    if: needs.native_scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mycellios-node-*
          path: build/ci-artifacts
          merge-multiple: false
      - name: Verify and assemble three native packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          source_id="$(node --input-type=module -e 'import { buildNativeSourceProvenance } from "./scripts/native-build-provenance.mjs"; process.stdout.write(buildNativeSourceProvenance(".").sourceId)')"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          published_at="$(node -e 'process.stdout.write(new Date(Number(process.argv[1]) * 1000).toISOString())' "$epoch")"
          transaction_id="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          npm run node:release:assemble -- \
            --artifacts=build/ci-artifacts \
            --output=build/native-release-assets \
            --version="$version" \
            --revision="$GITHUB_SHA" \
            --source-id="$source_id" \
            --published-at="$published_at"
          npx --no-install tsx src/coordinator/public-release-transaction-cli.ts \
            --assets=build/native-release-assets \
            --output=build/native-release-manifest.json \
            --version="$version" \
            --revision="$GITHUB_SHA" \
            --source-id="$source_id" \
            --transaction-id="$transaction_id"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mycellios-node-release-candidate
          path: |
            build/native-release-assets
            build/native-release-manifest.json
          if-no-files-found: error
          retention-days: 14
