name: CI

# Archivo gestionado por example/ci-templates.
# La lógica del pipeline vive en example/ci-templates.
#
# Si este archivo se elimina o modifica, el reconciler lo restaurará en ≤15 min.
# Para personalizar el pipeline para esta app, añade un example.yaml en la raíz
# o pasa inputs al reusable workflow:
#
#   jobs:
#     ci:
#       uses: example/ci-templates/.github/workflows/ci.yml@main
#       with:
#         node-version: "22"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    # On push, run only for the repository's real default branch. The
    # pull_request event still covers every feature branch without duplicating
    # the full pipeline for both push and PR.
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: example/ci-templates/.github/workflows/ci.yml@main
    # Mapa EXPLÍCITO de secrets (Option A, NOD-549) en lugar de `secrets: inherit`.
    # Pasamos solo los secrets que el reusable destino realmente consume, por
    # mínimo privilegio y para evitar el lint Semgrep
    # yaml.github-actions.security.secrets-inherit sin recurrir a `# nosemgrep`
    # (que era la solución provisional de NOD-398).
    #   - DOKPLOY_FLEET_DEPLOY_TOKEN: auto-redeploy al merge en main (POST /api/deploy/by-repo).
    # NOTA: GITHUB_TOKEN NO se lista: GitHub lo auto-inyecta en workflows reusables.
    secrets:
      DOKPLOY_FLEET_DEPLOY_TOKEN: ${{ secrets.DOKPLOY_FLEET_DEPLOY_TOKEN }}
