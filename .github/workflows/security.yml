name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: [self-hosted, nodecodex-ci, mycellios-isolated, Linux, X64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        shell: bash
        run: |
          set -uo pipefail

          for attempt in 1 2 3; do
            output_file="$(mktemp)"
            status=0
            timeout 75s npm audit --omit=dev --audit-level=high --fetch-timeout=60000 >"$output_file" 2>&1 || status=$?
            cat "$output_file"

            if [ "$status" -eq 0 ]; then
              rm -f "$output_file"
              exit 0
            fi

            if [ "$status" -ne 124 ] && ! grep -Eiq \
              'network timeout|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ENETUNREACH|ECONNREFUSED|socket hang up|429 Too Many Requests|502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout' \
              "$output_file"; then
              rm -f "$output_file"
              exit "$status"
            fi

            rm -f "$output_file"
            if [ "$attempt" -eq 3 ]; then
              case "${GITHUB_EVENT_NAME:-pull_request}" in
                schedule|workflow_dispatch)
                  echo "::error::npm audit could not reach the registry after 3 attempts."
                  exit 1
                  ;;
                *)
                  echo "::warning::npm audit could not reach the registry after 3 attempts; the enforced scheduled audit will retry independently."
                  exit 0
                  ;;
              esac
            fi

            echo "::warning::npm audit registry request failed on attempt $attempt/3; retrying."
            sleep "$((attempt * 10))"
          done

  secrets:
    name: Gitleaks
    runs-on: [self-hosted, nodecodex-ci, mycellios-isolated, Linux, X64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan the complete repository history
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.28.0
          detect --source=/repo --redact --verbose

  codeql:
    name: CodeQL (${{ matrix.language }})
    # GitHub code scanning requires Advanced Security while this repository is
    # private. It becomes available automatically when the repository is made
    # public, without leaving the pre-publication branch red.
    if: github.event.repository.private == false
    runs-on: [self-hosted, nodecodex-ci, mycellios-isolated, Linux, X64]
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          category: /language:${{ matrix.language }}
