name: Python tests

# Fichero DELIBERADAMENTE separado de `ci.yml`.
#
# `ci.yml` lo gestiona el reconciler de `nodecodex-org/.github`, que lo restaura
# en <=15 min si se edita. Su workflow reusable detecta el stack del repositorio,
# elige Node, y por eso el job `Test (Python)` sale *skipped*: los ~850 tests de
# Python —todo el camino caliente del runtime distribuido— no se ejecutan nunca
# en CI. Está diagnosticado en `docs/REGISTRO_VERIFICACIONES.md` §9, pero un
# diagnóstico no ejecuta tests.
#
# Este fichero no lo toca el reconciler, así que sobrevive.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python suite
    runs-on: [self-hosted, nodecodex-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 es la versión del venv sellado del proyecto. NO subir a 3.14 sin
          # comprobar los pines: numpy 1.26.4 no tiene wheel para 3.14.
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-py312-${{ hashFiles('scripts/wheel-locks/linux-x64-cp312.txt') }}

      # El lock de ruedas del runtime portable, no una resolución nueva en cada
      # corrida. Es el MISMO fichero que `check-portable-runtime-policy.mjs`
      # verifica por sha256 y el mismo que se empaqueta en el instalador, así que
      # CI prueba exactamente el runtime que se envía.
      #
      # Por qué importa y no es celo de reproducibilidad: el repo sella
      # `torch 2.13.0+cpu` en tres sitios que lo COMPROBAN —
      # `CERTIFIED_TORCH_VERSION` (expert_parallel.py:22), la aserción de
      # `test_expert_parallel.py:60` y la política de runtime portable—, así que
      # resolver `torch` a la última hacía que CI midiera un runtime que el
      # producto rechaza. Igual con `numpy`: el pin es 1.26.4 y el resolutor
      # traía la 2.x, que cambia reglas de promoción de tipos.
      #
      # `--require-hashes` sale solo: las 46 líneas del lock llevan sha256, y en
      # ese modo pip rechaza cualquier dependencia que no esté listada. Si algún
      # día falta una, la corrida falla ruidosamente en vez de instalarla suelta.
      - name: Install the sealed runtime (hash-pinned wheel lock)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement scripts/wheel-locks/linux-x64-cp312.txt

      - name: Show what got installed
        run: python -m pip list

      - name: Run the suite with the known-failure ratchet
        # El guion falla si aparece un fallo NUEVO, y también si uno de los
        # conocidos empieza a pasar (para obligar a podar la lista).
        run: python scripts/run-python-tests.py
        env:
          # Ningún test debe salir a la red a por pesos. Si alguno lo intenta,
          # queremos que falle ruidosamente en vez de colgarse o descargar 2 GB.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
