[Service]
Environment=MYCELLIOS_SUPABASE_URL=https://supabase-mycellios.example.io
Environment=MYCELLIOS_SUPABASE_SERVICE_ROLE_KEY_FILE=/etc/mycellios/supabase-service-role.secret
Environment=MYCELLIOS_SUPABASE_ANON_KEY_FILE=/etc/mycellios/supabase-anon.secret
Environment=MYCELLIOS_SUPABASE_PERSISTENCE_REQUIRED=1
Environment=MYCELLIOS_API_ACCESS_ENABLED=1
Environment=MYCELLIOS_API_STARTER_TOKENS=25000
Environment=MYCELLIOS_API_REQUESTS_PER_MINUTE=30
Environment=MYCELLIOS_API_MAX_CONCURRENT=2
Environment=MYCELLIOS_API_MAX_ACTIVE_KEYS=10
Environment=MYCELLIOS_PUBLIC_API_BASE_URL=https://www.mycellios.com/v1
